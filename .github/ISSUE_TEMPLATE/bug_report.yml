name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Ferrodock version
      placeholder: e.g. 0.1.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: input
    id: engine
    attributes:
      label: Docker engine
      placeholder: e.g. Ferrodock's engine, or Docker Engine 28
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, logs or steps to reproduce.
