version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      rust-dependencies:
        patterns: ["*"]
  # The guest agent that runs inside the engine's VM: its own crate and
  # lockfile, outside the workspace.
  - package-ecosystem: cargo
    directory: /agent
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      agent-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(docs-deps)"
    groups:
      docs-dependencies:
        patterns: ["*"]
