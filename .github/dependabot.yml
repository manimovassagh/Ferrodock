version: 2

# Every dependency update, from all four places below, comes in one pull
# request a week, so CI runs (and the macOS runners are busy) once rather
# than once per ecosystem. When a major version needs code changes, push
# them to that pull request's branch and merge it as usual.
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"

updates:
  - package-ecosystem: cargo
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
  # The guest agent that runs inside the engine's VM: its own crate and
  # lockfile, outside the workspace.
  - package-ecosystem: cargo
    directory: /agent
    patterns: ["*"]
    multi-ecosystem-group: dependencies
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
  - package-ecosystem: npm
    directory: /website
    patterns: ["*"]
    multi-ecosystem-group: dependencies
