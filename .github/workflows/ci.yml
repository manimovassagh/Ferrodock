name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per pull request, or per branch: a new push cancels the PR's run
# that's still going, so stale runs don't hold the few macOS runners. On
# main, runs queue instead, so every merged commit is still checked.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only unless a job says otherwise: the build scripts of a few
# hundred crates run here, and none of them needs to write anything.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Whether anything besides the docs site and Markdown changed. The jobs
  # below are skipped otherwise (a skipped job counts as passed).
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # A new branch or a force push has no usable base: check everything.
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE" HEAD | grep -qvE '^website/|\.md$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    name: Format, lint and test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The agent that runs inside the engine's Linux VM (its own crate).
      - run: cargo fmt --manifest-path agent/Cargo.toml --check
      - run: cargo clippy --manifest-path agent/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path agent/Cargo.toml
      # The app on an X11 desktop: a virtual screen, software OpenGL.
      - name: X11 smoke test
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xdotool imagemagick libgl1-mesa-dri
          cargo build
          scripts/x11-smoke.sh target/debug/ferrodock x11-smoke.png
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: x11-smoke
          path: |
            x11-smoke.png
            x11-smoke.log
          if-no-files-found: ignore

  # Ferrodock stays free for anyone, companies included: only the
  # permissive licenses in deny.toml are allowed in dependencies. No
  # dependency may have a known vulnerability either (audit.yml also
  # checks every week, for advisories published since).
  licenses:
    name: Licenses and advisories
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-deny
      - run: cargo deny check licenses advisories
      - run: cargo deny --manifest-path agent/Cargo.toml --config deny.toml check licenses advisories

  build:
    name: Build (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        # Fixed images, not *-latest: a new image (and its tools) arrives
        # in a reviewed change, not on its own on some release day.
        include:
          - { os: windows-2025, name: Windows }
          - { os: macos-15, name: macOS }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --workspace
