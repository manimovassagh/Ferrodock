name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # The agent that runs inside the engine's Linux VM (its own crate).
      - run: cargo fmt --manifest-path agent/Cargo.toml --check
      - run: cargo clippy --manifest-path agent/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path agent/Cargo.toml

  # Ferrodock stays free for anyone, companies included: only the
  # permissive licenses in deny.toml are allowed in dependencies.
  licenses:
    name: Licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check licenses
      - run: cargo deny --manifest-path agent/Cargo.toml --config deny.toml check licenses

  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build
