name: Engine

# Builds Ferrodock's engine images: for Apple Silicon, our arm64 kernel,
# the Docker engine and ferrodock-agent, packed as kernel + rootfs.img (on
# a native arm64 runner, so nothing is emulated); for Windows, the Docker
# engine and ferrodock-agent as a root filesystem WSL imports; for Linux,
# the Docker engine's programs (amd64 and arm64). Then publishes them all,
# once per engine/VERSION.

on:
  push:
    branches: [main]
    paths: ["agent/**", "engine/**", "src/vm/mux.rs", ".github/workflows/engine.yml"]
  pull_request:
    paths: ["agent/**", "engine/**", "src/vm/mux.rs", ".github/workflows/engine.yml"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # LinuxKit's kernel: its source and config are the base for ours.
  KERNEL_IMAGE: linuxkit/kernel:6.12.59

jobs:
  image:
    name: Build the engine image (arm64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y flex bison bc libssl-dev libelf-dev e2fsprogs zstd musl-tools

      - name: Kernel source and base config
        run: |
          id=$(docker create "$KERNEL_IMAGE" /x)
          docker cp "$id:/linux.tar.xz" .
          docker cp "$id:/kernel-dev.tar" .
          docker rm "$id"
          tar -xJf linux.tar.xz
          tar -xf kernel-dev.tar --wildcards '*/linux-headers-*/.config' -O > base.config
      - uses: actions/cache@v5
        with:
          path: kernel-out
          key: kernel-${{ env.KERNEL_IMAGE }}-${{ hashFiles('engine/kernel/**') }}
      - name: Kernel
        run: test -f kernel-out/Image || engine/kernel/build.sh linux base.config kernel-out

      - name: Agent
        run: cargo build --manifest-path agent/Cargo.toml --release --target aarch64-unknown-linux-musl
      - name: Image
        run: |
          engine/build.sh kernel-out/Image kernel-out/modules \
            agent/target/aarch64-unknown-linux-musl/release/ferrodock-agent out
          tar -C out -cf - kernel rootfs.img | zstd -19 -T0 > ferrodock-engine-arm64.tar.zst
          sha256sum ferrodock-engine-arm64.tar.zst | tee ferrodock-engine-arm64.tar.zst.sha256
          cp kernel-out/config ferrodock-engine-arm64.kernel-config
          cp out/packages.txt ferrodock-engine-arm64.packages.txt
          cp engine/NOTICE.md ferrodock-engine-arm64.NOTICE.md
          # The kernel is GPL-2.0: its exact source ships with the image.
          cp linux.tar.xz ferrodock-engine-arm64.kernel-source.tar.xz
      - uses: actions/upload-artifact@v7
        with:
          name: ferrodock-engine-arm64
          path: |
            ferrodock-engine-arm64.tar.zst
            ferrodock-engine-arm64.tar.zst.sha256
            ferrodock-engine-arm64.kernel-config
            ferrodock-engine-arm64.packages.txt
            ferrodock-engine-arm64.NOTICE.md
            ferrodock-engine-arm64.kernel-source.tar.xz

  wsl:
    name: Build the engine image (Windows, WSL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y zstd musl-tools
      - name: Agent
        run: cargo build --manifest-path agent/Cargo.toml --release --target x86_64-unknown-linux-musl
      - name: Image
        run: |
          engine/wsl/build.sh agent/target/x86_64-unknown-linux-musl/release/ferrodock-agent out
          mv out/ferrodock-engine-wsl-amd64.tar.zst .
          sha256sum ferrodock-engine-wsl-amd64.tar.zst | tee ferrodock-engine-wsl-amd64.tar.zst.sha256
          cp out/packages.txt ferrodock-engine-wsl-amd64.packages.txt
      - uses: actions/upload-artifact@v7
        with:
          name: ferrodock-engine-wsl-amd64
          path: |
            ferrodock-engine-wsl-amd64.tar.zst
            ferrodock-engine-wsl-amd64.tar.zst.sha256
            ferrodock-engine-wsl-amd64.packages.txt

  linux:
    name: Build the engine image (Linux, ${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y zstd
      - name: Image
        run: |
          engine/linux/build.sh ${{ matrix.arch }} out
          mv out/ferrodock-engine-linux-${{ matrix.arch }}.tar.zst .
          sha256sum ferrodock-engine-linux-${{ matrix.arch }}.tar.zst | tee ferrodock-engine-linux-${{ matrix.arch }}.tar.zst.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: ferrodock-engine-linux-${{ matrix.arch }}
          path: |
            ferrodock-engine-linux-${{ matrix.arch }}.tar.zst
            ferrodock-engine-linux-${{ matrix.arch }}.tar.zst.sha256

  # Ferrodock downloads the image of the version in engine/VERSION from
  # the release engine-v<version>. A pre-release, so it never shows as the
  # app's latest release (the updater and Homebrew use that).
  publish:
    name: Publish (main only, once per version)
    if: github.event_name != 'pull_request'
    needs: [image, wsl, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(tr -d '[:space:]' < engine/VERSION)
          tag="engine-v$version"
          cd assets
          if gh release view "$tag" >/dev/null 2>&1; then
            # Already out: only add what it doesn't have yet. The images
            # themselves never change once published.
            have=$(gh release view "$tag" --json assets -q '.assets[].name')
            for file in *; do
              grep -qx "$file" <<<"$have" || gh release upload "$tag" "$file"
            done
          else
            gh release create "$tag" --prerelease --latest=false \
              --title "Ferrodock engine $version" \
              --notes "The images of Ferrodock's own Docker engine: a Linux VM for Apple Silicon Macs (arm64), a WSL distro for Windows (wsl-amd64), and the Docker engine's programs for Linux (linux-amd64, linux-arm64). Ferrodock downloads the one it needs by itself; there's no need to get them by hand. Built from engine/ and agent/ at ${{ github.sha }}. Free and open source: see NOTICE.md for what's inside, its licenses and sources." \
              *
          fi
