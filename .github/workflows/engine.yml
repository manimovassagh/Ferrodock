name: Engine

# Builds Ferrodock's engine images: for Macs, our kernel, the Docker
# engine and ferrodock-agent, packed as kernel + rootfs.img, arm64 for
# Apple Silicon and amd64 for Intel (each on a native runner, so nothing
# is emulated); for Windows, the Docker
# engine and ferrodock-agent as a root filesystem WSL imports; for Linux,
# the Docker engine's programs (amd64 and arm64). Then publishes them all,
# once per engine/VERSION.

on:
  push:
    branches: [main]
    paths: ["agent/**", "engine/**", "src/vm/mux.rs", ".github/workflows/engine.yml"]
  pull_request:
    paths: ["agent/**", "engine/**", "src/vm/mux.rs", ".github/workflows/engine.yml"]
  workflow_dispatch:

# Read-only unless a job says otherwise: the build scripts of a few
# hundred crates run here, and none of them needs to write anything.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # LinuxKit's kernel: its source and config are the base for ours.
  KERNEL_IMAGE: linuxkit/kernel:6.12.59

jobs:
  image:
    name: Build the engine image (Mac, ${{ matrix.arch }})
    strategy:
      matrix:
        include:
          # Apple Silicon.
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          # Intel Macs.
          - arch: amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: agent
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y flex bison bc libssl-dev libelf-dev e2fsprogs zstd musl-tools

      # LinuxKit's kernel for the image's architecture (the runner's own).
      - name: Kernel source and base config
        run: |
          id=$(docker create --platform linux/${{ matrix.arch }} "$KERNEL_IMAGE" /x)
          docker cp "$id:/linux.tar.xz" .
          docker cp "$id:/kernel-dev.tar" .
          docker rm "$id"
          tar -xJf linux.tar.xz
          tar -xf kernel-dev.tar --wildcards '*/linux-headers-*/.config' -O > base.config
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: kernel-out
          key: kernel-${{ matrix.arch }}-${{ env.KERNEL_IMAGE }}-${{ hashFiles('engine/kernel/**') }}
      - name: Kernel
        run: test -f kernel-out/kernel || engine/kernel/build.sh ${{ matrix.arch }} linux base.config kernel-out

      - name: Agent
        run: cargo build --manifest-path agent/Cargo.toml --release --target ${{ matrix.target }}
      - name: Image
        run: |
          name=ferrodock-engine-${{ matrix.arch }}
          engine/build.sh ${{ matrix.arch }} kernel-out/kernel kernel-out/modules \
            agent/target/${{ matrix.target }}/release/ferrodock-agent out
          tar -C out -cf - kernel rootfs.img | zstd -19 -T0 > "$name.tar.zst"
          sha256sum "$name.tar.zst" | tee "$name.tar.zst.sha256"
          cp kernel-out/config "$name.kernel-config"
          cp out/packages.txt "$name.packages.txt"
          cp engine/NOTICE.md "$name.NOTICE.md"
          # The kernel is GPL-2.0: its exact source ships with the image.
          cp linux.tar.xz "$name.kernel-source.tar.xz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ferrodock-engine-${{ matrix.arch }}
          path: |
            ferrodock-engine-${{ matrix.arch }}.tar.zst
            ferrodock-engine-${{ matrix.arch }}.tar.zst.sha256
            ferrodock-engine-${{ matrix.arch }}.kernel-config
            ferrodock-engine-${{ matrix.arch }}.packages.txt
            ferrodock-engine-${{ matrix.arch }}.NOTICE.md
            ferrodock-engine-${{ matrix.arch }}.kernel-source.tar.xz

  wsl:
    name: Build the engine image (Windows, WSL)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: agent
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y zstd musl-tools
      - name: Agent
        run: cargo build --manifest-path agent/Cargo.toml --release --target x86_64-unknown-linux-musl
      - name: Image
        run: |
          engine/wsl/build.sh agent/target/x86_64-unknown-linux-musl/release/ferrodock-agent out
          mv out/ferrodock-engine-wsl-amd64.tar.zst .
          sha256sum ferrodock-engine-wsl-amd64.tar.zst | tee ferrodock-engine-wsl-amd64.tar.zst.sha256
          cp out/packages.txt ferrodock-engine-wsl-amd64.packages.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ferrodock-engine-wsl-amd64
          path: |
            ferrodock-engine-wsl-amd64.tar.zst
            ferrodock-engine-wsl-amd64.tar.zst.sha256
            ferrodock-engine-wsl-amd64.packages.txt

  linux:
    name: Build the engine image (Linux, ${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y zstd
      - name: Image
        run: |
          engine/linux/build.sh ${{ matrix.arch }} out
          mv out/ferrodock-engine-linux-${{ matrix.arch }}.tar.zst .
          sha256sum ferrodock-engine-linux-${{ matrix.arch }}.tar.zst | tee ferrodock-engine-linux-${{ matrix.arch }}.tar.zst.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ferrodock-engine-linux-${{ matrix.arch }}
          path: |
            ferrodock-engine-linux-${{ matrix.arch }}.tar.zst
            ferrodock-engine-linux-${{ matrix.arch }}.tar.zst.sha256

  # Ferrodock downloads the image of the version in engine/VERSION from
  # the release engine-v<version>. A pre-release, so it never shows as the
  # app's latest release (the updater and Homebrew use that).
  publish:
    name: Publish (main only, once per version)
    if: github.event_name != 'pull_request'
    needs: [image, wsl, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Not "assets": that's the app's own folder in the repository.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: engine-release
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(tr -d '[:space:]' < engine/VERSION)
          tag="engine-v$version"
          cd engine-release
          if gh release view "$tag" >/dev/null 2>&1; then
            # Already out: only add what it doesn't have yet. The images
            # themselves never change once published.
            have=$(gh release view "$tag" --json assets -q '.assets[].name')
            for file in *; do
              grep -qx "$file" <<<"$have" || gh release upload "$tag" "$file"
            done
          else
            gh release create "$tag" --prerelease --latest=false \
              --title "Ferrodock engine $version" \
              --notes "The images of Ferrodock's own Docker engine: a Linux VM for Macs (arm64 for Apple Silicon, amd64 for Intel), a WSL distro for Windows (wsl-amd64), and the Docker engine's programs for Linux (linux-amd64, linux-arm64). Ferrodock downloads the one it needs by itself; there's no need to get them by hand. Built from engine/ and agent/ at ${{ github.sha }}. Free and open source: see NOTICE.md for what's inside, its licenses and sources." \
              *
          fi

      # The app downloads the version engine/SHA256SUMS names, and accepts
      # only the images it lists: pin this one now that it's out. From the
      # release itself, so the lines are those of the files people get.
      - name: Pin it for the app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(tr -d '[:space:]' < engine/VERSION)
          tag="engine-v$version"
          dir=$(mktemp -d)
          gh release download "$tag" --pattern '*.tar.zst.sha256' --dir "$dir"
          {
            sed -n '/^#/p' engine/SHA256SUMS
            echo "$tag"
            cat "$dir"/*.sha256 | sort -k2
          } > SHA256SUMS.new
          for arch in arm64 amd64 wsl-amd64 linux-amd64 linux-arm64; do
            grep -q " ferrodock-engine-$arch.tar.zst$" SHA256SUMS.new \
              || { echo "::error::$tag has no ferrodock-engine-$arch.tar.zst"; exit 1; }
          done
          mv SHA256SUMS.new engine/SHA256SUMS
          if git diff --quiet engine/SHA256SUMS; then
            echo "Already pinned."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(engine): use $tag" engine/SHA256SUMS
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            sleep $((attempt * 5))
            git pull --rebase origin main
          done
          exit 1
