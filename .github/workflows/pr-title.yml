name: PR title

# PRs are squash-merged, so the PR title becomes the commit message that
# release-plz reads. It must follow Conventional Commits, e.g.
# "feat: add image pulling" or "fix(logs): keep the scroll position".
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
            security
