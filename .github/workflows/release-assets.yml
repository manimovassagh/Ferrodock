name: Release assets

# Builds Ferrodock for every platform from a release tag, attaches the
# binaries and SHA256SUMS.txt to that tag's GitHub Release, and publishes
# the release if it's still a draft.
#
# Called by release.yml after release-plz creates a release. Can also be run
# by hand from the Actions tab to rebuild the assets of an existing tag.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag, e.g. v0.3.0
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v0.3.0
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - name: Package
        shell: bash
        run: |
          mkdir dist
          cp target/release/ferrodock.exe dist/Ferrodock.exe
          cd dist && 7z a "Ferrodock-${TAG#v}-windows-x64.zip" Ferrodock.exe
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - run: packaging/macos/bundle.sh
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: |
            dist/*.zip
            dist/*.dmg

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - name: Package
        run: |
          mkdir dist
          tar -czf "dist/Ferrodock-${TAG#v}-linux-x64.tar.gz" -C target/release ferrodock
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/*.tar.gz

  publish:
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      latest: ${{ steps.latest.outputs.latest }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum Ferrodock-* | tee SHA256SUMS.txt
      - name: Attach to the release
        run: gh release upload "$TAG" dist/* --clobber
      - name: Publish the release
        run: |
          read -r draft prerelease < <(gh release view "$TAG" --json isDraft,isPrerelease -q '"\(.isDraft) \(.isPrerelease)"')
          if [ "$draft" != "true" ]; then
            echo "Already published; assets updated."
          elif [ "$prerelease" = "true" ]; then
            gh release edit "$TAG" --draft=false
          else
            gh release edit "$TAG" --draft=false --latest
          fi
      - name: Is this the latest release?
        id: latest
        run: |
          latest=$(gh release view --json tagName -q .tagName)
          echo "latest=$([ "$latest" = "$TAG" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  # Points the Homebrew cask (Casks/ferrodock.rb) at the new DMG.
  homebrew:
    needs: publish
    if: needs.publish.outputs.latest == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/download-artifact@v8
        with:
          name: macos
          path: dist
      - name: Update the cask
        run: |
          version=${TAG#v}
          sha=$(sha256sum "dist/Ferrodock-$version-macos-universal.dmg" | cut -d' ' -f1)
          packaging/homebrew/update-cask.sh "$version" "$sha"
      - name: Commit
        run: |
          # Staged first, so a brand-new cask file counts as a change too.
          git add Casks/ferrodock.rb
          if git diff --cached --quiet; then
            echo "Cask already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update Homebrew cask to ${TAG}"
          git push

  # Publishes the crate to crates.io, so `cargo install ferrodock` works.
  # Needs a CARGO_REGISTRY_TOKEN secret; without it this step is skipped.
  crates:
    needs: publish
    if: needs.publish.outputs.latest == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::notice::No CARGO_REGISTRY_TOKEN secret, so not publishing to crates.io."
            exit 0
          fi
          version=${TAG#v}
          if curl -fsS -A "ferrodock-release (github.com/manimovassagh/Ferrodock)" \
              "https://crates.io/api/v1/crates/ferrodock/$version" > /dev/null; then
            echo "ferrodock $version is already on crates.io."
            exit 0
          fi
          cargo publish --locked
