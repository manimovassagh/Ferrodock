name: Release assets

# Builds Ferrodock for every platform from a release tag, attaches the
# binaries and SHA256SUMS.txt to that tag's GitHub Release, and publishes
# the release if it's still a draft.
#
# Called by release.yml after release-plz creates a release. Can also be run
# by hand from the Actions tab to rebuild the assets of an existing tag.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag, e.g. v0.3.0
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v0.3.0
        required: true
        type: string

# Read-only unless a job says otherwise: the build scripts of a few
# hundred crates run here, and none of them needs to write anything.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag }}

jobs:
  # Each build has a time limit: a runner that hangs (one starved of memory
  # linking with full LTO once ran for 46 minutes) fails the build instead
  # of leaving the release a draft with nobody told; see `report` below.
  windows:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.99.1" # rust-toolchain.toml
      # Dependencies built once and reused: a release build is a full LTO
      # build of a few hundred crates.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-windows
      - run: cargo build --release --locked --workspace
      - name: Package
        shell: bash
        run: |
          mkdir dist
          cp target/release/ferrodock.exe dist/Ferrodock.exe
          cp target/release/fdock.exe target/release/ferrodock-mcp.exe dist/
          cd dist && 7z a "Ferrodock-${TAG#v}-windows-x64.zip" Ferrodock.exe fdock.exe ferrodock-mcp.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: dist/*.zip

  macos:
    runs-on: macos-15
    # Builds for both Apple Silicon and Intel: about 20 minutes.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.99.1" # rust-toolchain.toml
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-macos
      # With a Developer ID certificate and an App Store Connect API key in
      # the repository's secrets, the app is signed and notarized; without
      # them, ad-hoc signed as before. See RELEASING.md.
      - name: Signing keys
        id: keys
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PW: ${{ secrets.MACOS_CERT_PW }}
          AC_API_KEY: ${{ secrets.AC_API_KEY }}
        run: |
          if [ -z "$MACOS_CERT_P12" ]; then
            echo "No MACOS_CERT_P12 secret: ad-hoc signing."
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 16)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERT_PW" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" | grep -o '"Developer ID Application[^"]*"' | head -1 | tr -d '"')
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          if [ -n "$AC_API_KEY" ]; then
            echo "$AC_API_KEY" > "$RUNNER_TEMP/notary.p8"
            echo "key=$RUNNER_TEMP/notary.p8" >> "$GITHUB_OUTPUT"
          fi
      - run: packaging/macos/bundle.sh
        env:
          MACOS_SIGN_IDENTITY: ${{ steps.keys.outputs.identity || '-' }}
          NOTARY_KEY: ${{ steps.keys.outputs.key }}
          NOTARY_KEY_ID: ${{ secrets.AC_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.AC_ISSUER }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: |
            dist/*.zip
            dist/*.dmg

  # x64 and arm64, each on its own runner: a .tar.gz (what the in-app
  # updater downloads), a .deb with a desktop entry, and an AppImage.
  linux:
    strategy:
      matrix:
        include:
          - { arch: amd64, tar: x64, appimage: x86_64, runner: ubuntu-24.04 }
          - { arch: arm64, tar: arm64, appimage: aarch64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.99.1" # rust-toolchain.toml
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-linux
      - run: cargo build --release --locked --workspace
      - name: Package
        run: |
          # appimagetool checks the desktop entry with it.
          sudo apt-get update -qq && sudo apt-get install -y -qq desktop-file-utils
          mkdir dist
          tar -czf "dist/Ferrodock-${TAG#v}-linux-${{ matrix.tar }}.tar.gz" -C target/release ferrodock fdock ferrodock-mcp
          packaging/linux/deb.sh ${{ matrix.arch }} "${TAG#v}" target/release dist
          packaging/linux/appimage.sh ${{ matrix.appimage }} "${TAG#v}" target/release dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.AppImage

  publish:
    needs: [windows, macos, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      latest: ${{ steps.latest.outputs.latest }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum Ferrodock-* | tee SHA256SUMS.txt
      # Signed with the key whose public half is in packaging/minisign.pub:
      # the app checks it before an update. Skipped without the secret.
      - name: Sign the checksums
        working-directory: dist
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            echo "::notice::No MINISIGN_SECRET_KEY secret, so SHA256SUMS.txt isn't signed."
            exit 0
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq minisign
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/minisign.key"
          minisign -S -s "$RUNNER_TEMP/minisign.key" -m SHA256SUMS.txt -t "Ferrodock $TAG"
          shred -u "$RUNNER_TEMP/minisign.key"
      - name: Attach to the release
        run: gh release upload "$TAG" dist/* --clobber
      # Two releases can finish in either order (v1.24.0 once published two
      # minutes before v1.23.0). Only the highest version is marked latest
      # and updates the Homebrew cask, whichever finishes last.
      - name: Is this the highest version?
        id: latest
        run: |
          prerelease=$(gh release view "$TAG" --json isPrerelease -q .isPrerelease)
          highest=$({ gh release list --exclude-drafts --exclude-pre-releases --limit 100 --json tagName -q '.[].tagName'; echo "$TAG"; } | sort -V | tail -n 1)
          latest=$([ "$prerelease" != "true" ] && [ "$highest" = "$TAG" ] && echo true || echo false)
          echo "Highest published version: $highest; this is the latest: $latest"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
      - name: Publish the release
        env:
          LATEST: ${{ steps.latest.outputs.latest }}
        run: |
          if [ "$(gh release view "$TAG" --json isDraft -q .isDraft)" != "true" ]; then
            echo "Already published; assets updated."
          else
            gh release edit "$TAG" --draft=false --latest="$LATEST"
          fi

  # Points the Homebrew cask (Casks/ferrodock.rb) at the new DMG, in a
  # pull request: main is protected, so nothing pushes to it directly.
  homebrew:
    needs: publish
    if: needs.publish.outputs.latest == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows
          path: dist
      - name: Update the cask and the Scoop manifest
        run: |
          version=${TAG#v}
          sha=$(sha256sum "dist/Ferrodock-$version-macos-universal.dmg" | cut -d' ' -f1)
          packaging/homebrew/update-cask.sh "$version" "$sha"
          sha=$(sha256sum "dist/Ferrodock-$version-windows-x64.zip" | cut -d' ' -f1)
          packaging/scoop/update.sh "$version" "$sha"
      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Staged first, so a brand-new cask file counts as a change too.
          git add Casks/ferrodock.rb packaging/scoop/ferrodock.json
          if git diff --cached --quiet; then
            echo "Cask already up to date."
            exit 0
          fi
          branch="homebrew/cask-${TAG}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update Homebrew cask and Scoop manifest to ${TAG}"
          git push --force origin "HEAD:refs/heads/$branch"
          if [ -z "$(gh pr list --head "$branch" --json number -q '.[].number')" ]; then
            gh pr create --base main --head "$branch" \
              --title "chore: update Homebrew cask and Scoop manifest to ${TAG}" \
              --body "Points the Homebrew cask at the ${TAG} DMG and the Scoop manifest at its Windows zip."
          fi

  # Publishes the crate to crates.io, so `cargo install ferrodock` works.
  # Every release, not just the latest: crates.io takes an older version
  # after a newer one. Needs a CARGO_REGISTRY_TOKEN secret; without it this
  # step is skipped.
  # Trusted publishing: crates.io trusts this repository's release
  # workflows (set up once per crate on crates.io, see RELEASING.md) and
  # hands out a token that lasts for this job only. The CARGO_REGISTRY_TOKEN
  # secret is the fallback until then; delete it once trusted publishing
  # works.
  crates:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.99.1" # rust-toolchain.toml
      - name: Trusted publishing
        id: auth
        # Not set up on crates.io yet: the secret is used instead.
        continue-on-error: true
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
          TRUSTED: ${{ steps.auth.outputs.token != '' }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::notice::Neither trusted publishing nor a CARGO_REGISTRY_TOKEN secret, so not publishing to crates.io."
            exit 0
          fi
          if [ "$TRUSTED" = true ]; then
            echo "Publishing with a trusted-publishing token."
          else
            echo "::notice::Publishing with the CARGO_REGISTRY_TOKEN secret: trusted publishing isn't set up on crates.io yet."
          fi
          version=${TAG#v}
          # The shared crate first: the others depend on it.
          for crate in ferrodock-core ferrodock-cli ferrodock-mcp ferrodock; do
            if curl -fsS -A "ferrodock-release (github.com/manimovassagh/Ferrodock)" \
                "https://crates.io/api/v1/crates/$crate/$version" > /dev/null; then
              echo "$crate $version is already on crates.io."
            else
              cargo publish --locked -p "$crate"
            fi
          done

  # Submits the new version to winget (microsoft/winget-pkgs), as a pull
  # request from a fork owned by the account of the WINGET_TOKEN secret (a
  # classic token with the public_repo scope). Skipped without it.
  winget:
    needs: publish
    if: needs.publish.outputs.latest == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows
          path: dist
      - name: Open a pull request on winget-pkgs
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::No WINGET_TOKEN secret, so not submitting to winget."
            exit 0
          fi
          version=${TAG#v}
          id=ManiMovassagh.Ferrodock
          sha=$(sha256sum "dist/Ferrodock-$version-windows-x64.zip" | cut -d' ' -f1)
          packaging/winget/manifests.sh "$version" "$sha" manifests

          me=$(gh api user -q .login)
          fork="$me/winget-pkgs"
          gh repo fork microsoft/winget-pkgs --clone=false || true
          for _ in $(seq 30); do gh api "repos/$fork" > /dev/null 2>&1 && break; sleep 10; done
          gh api -X POST "repos/$fork/merge-upstream" -f branch=master > /dev/null || true

          branch="ferrodock-$version"
          if ! gh api "repos/$fork/git/ref/heads/$branch" > /dev/null 2>&1; then
            base=$(gh api "repos/$fork/git/ref/heads/master" -q .object.sha)
            gh api -X POST "repos/$fork/git/refs" -f ref="refs/heads/$branch" -f sha="$base" > /dev/null
          fi
          dir="manifests/m/ManiMovassagh/Ferrodock/$version"
          for file in manifests/*.yaml; do
            path="$dir/$(basename "$file")"
            existing=$(gh api "repos/$fork/contents/$path?ref=$branch" -q .sha 2>/dev/null || true)
            gh api -X PUT "repos/$fork/contents/$path" \
              -f message="New version: $id version $version" \
              -f branch="$branch" \
              -f content="$(base64 -w0 "$file")" \
              ${existing:+-f sha="$existing"} > /dev/null
          done

          open=$(gh api "repos/microsoft/winget-pkgs/pulls?head=$me:$branch&state=all" -q length)
          if [ "$open" != "0" ]; then
            echo "Already submitted."
            exit 0
          fi
          gh pr create --repo microsoft/winget-pkgs --base master --head "$me:$branch" \
            --title "New version: $id version $version" \
            --body "Ferrodock $version, the native container manager, written in Rust: https://github.com/manimovassagh/Ferrodock/releases/tag/$TAG"

  # A build that failed, hung or was cancelled leaves the release a draft
  # with no downloads. Say so in an issue, with how to finish it.
  report:
    needs: [windows, macos, linux, publish, homebrew, crates, winget]
    if: always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      RESULTS: ${{ toJSON(needs) }}
    steps:
      - name: Open an issue
        run: |
          title="Release $TAG didn't finish"
          if gh issue list --state open --search "\"$title\" in:title" --json title -q '.[].title' | grep -qxF "$title"; then
            echo "Already reported."
            exit 0
          fi
          jobs=$(jq -r 'to_entries[] | "- \(.key): \(.value.result)"' <<< "$RESULTS")
          gh issue create --title "$title" --label release --body "$(cat <<BODY
          The [release run]($RUN) for $TAG stopped before it finished:

          $jobs

          Until it does, the release may be a draft with no downloads, or
          Homebrew and crates.io may be behind. To finish it, run **Release
          assets** again for the tag (it only redoes what's missing):

              gh workflow run release-assets.yml -f tag=$TAG

          Re-running the **Release** workflow doesn't help: the tag already
          exists, so it builds nothing.
          BODY
          )"
