name: Release

# The release pipeline, driven by release-plz (see release-plz.toml):
#
# 1. Every push to main updates the release PR ("chore: release vX.Y.Z"),
#    which bumps the version and the changelog from Conventional Commits.
# 2. Merging that PR pushes the tag and creates a draft GitHub Release.
# 3. release-assets.yml builds every platform, attaches the binaries and
#    checksums, and publishes the release.
on:
  push:
    branches: [main]

# Read-only unless a job says otherwise: the build scripts of a few
# hundred crates run here, and none of them needs to write anything.
permissions:
  contents: read

jobs:
  release:
    name: Tag and draft release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release-plz-release
      cancel-in-progress: false
    outputs:
      created: ${{ steps.release-plz.outputs.releases_created }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - id: release-plz
        uses: release-plz/action@b2baf303c463c223526d52a8a91b0777f052cf3f # v0.5.146
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - id: tag
        if: steps.release-plz.outputs.releases_created == 'true'
        env:
          RELEASES: ${{ steps.release-plz.outputs.releases }}
        run: echo "tag=$(jq -r '.[0].tag' <<< "$RELEASES")" >> "$GITHUB_OUTPUT"

  assets:
    name: Build and publish
    needs: release
    if: needs.release.outputs.created == 'true'
    # Everything the called workflow's jobs ask for: GitHub won't start it
    # if a job there asks for more than this. `issues` is for its report of
    # a release that didn't finish.
    permissions:
      contents: write
      issues: write
    uses: ./.github/workflows/release-assets.yml
    # Called workflows don't see the repository's secrets unless passed on;
    # the crates.io step needs CARGO_REGISTRY_TOKEN.
    secrets: inherit
    with:
      tag: ${{ needs.release.outputs.tag }}

  # After the release job, so the tag of a release PR merged by this push
  # exists before the next version is worked out from the tags. Otherwise
  # it works out the same version again and opens a second release PR.
  release-pr:
    name: Update the release PR
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-pr
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # A newer push to main has its own run, which updates the PR from
      # there; this one would only work from a stale version.
      - name: Is main still here?
        id: main
        run: |
          head=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::notice::main has moved on to $head; its own run updates the release PR."
            echo "moved=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
        if: steps.main.outputs.moved != 'true'
      - uses: release-plz/action@b2baf303c463c223526d52a8a91b0777f052cf3f # v0.5.146
        if: steps.main.outputs.moved != 'true'
        with:
          command: release-pr
        env:
          # A personal access token in RELEASE_PLZ_TOKEN lets CI run on the
          # release PR; PRs opened with the default token don't trigger CI.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
