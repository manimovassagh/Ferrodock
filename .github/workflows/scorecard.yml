name: Scorecard

# OpenSSF Scorecard: checks the repository against supply-chain security
# practices (branch protection, pinned actions, token permissions, ...)
# and shows the findings under Security > Code scanning. The score is
# public at https://scorecard.dev/viewer/?uri=github.com/manimovassagh/Ferrodock
on:
  push:
    branches: [main]
  schedule:
    - cron: "31 5 * * 2"
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    permissions:
      # Upload the results to code scanning.
      security-events: write
      # Publish the results, so the badge and viewer show them.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
