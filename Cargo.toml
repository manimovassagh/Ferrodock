[package]
name = "ferrodock"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
description = "A fast, native container manager for Docker, written in Rust."
homepage.workspace = true
readme = "README.md"
keywords = ["docker", "containers", "gui", "desktop", "egui"]
categories = ["gui", "development-tools"]
# Only what building needs; the website, docs and packaging stay on GitHub.
include = ["/src", "/assets", "/build.rs", "/engine/VERSION", "/README.md", "/LICENSE", "/CHANGELOG.md"]

# The desktop app (this package) and the crates it shares code with:
#   crates/core  ferrodock-core, the Docker layer (no UI)
#   crates/cli   ferrodock-cli, the `fdock` command
#   crates/mcp   ferrodock-mcp, the MCP server for AI tools
# They share one version, the app's.
[workspace]
members = [".", "crates/core", "crates/cli", "crates/mcp"]
# The agent that runs inside the engine's Linux VM (#114) is its own
# crate, built separately: it ships inside the engine image, not here.
exclude = ["agent"]

[workspace.package]
version = "1.19.0"
edition = "2024"
rust-version = "1.95"
authors = ["Mani Movassagh"]
repository = "https://github.com/manimovassagh/Ferrodock"
license = "MIT"
homepage = "https://manimovassagh.github.io/Ferrodock/"

[workspace.dependencies]
ferrodock-core = { path = "crates/core", version = "1.19.0" }
bollard = { version = "0.21.1", features = ["time", "ssl"] }
bytes = "1.12.1"
futures-util = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tar = "0.4.46"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "time", "fs", "process", "io-util", "net", "sync"] }

[dependencies]
ferrodock-core.workspace = true
bollard.workspace = true
bytes.workspace = true
eframe = { version = "0.37.0", features = ["persistence"] }
egui_extras = { version = "0.37", default-features = false }
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
self_update = { version = "1.3.1", default-features = false, features = ["github", "ureq", "rustls", "native-certs", "archive-zip", "compression-zip-deflate", "compression-tar-gz"] }
self-replace = "1.5.0"
notify-rust = "4.18.2"
sha2 = "0.10.9"
tar.workspace = true
vt100 = "0.16.2"
ureq = "3.4.2"
ruzstd = "0.9.1"
tokio.workspace = true
# The system's file picker; on Linux through the desktop portal, no GTK.
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }

# Contexts over SSH run the system's ssh, which bollard supports on Unix.
[target.'cfg(unix)'.dependencies]
bollard = { version = "0.21.1", features = ["ssh"] }

# The menu bar / notification area icon. Linux would need GTK, so it's
# left out there.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tray-icon = "0.26.1"

# Ferrodock's own engine: a Linux VM through Apple's Virtualization
# framework, on Apple Silicon.
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
objc2 = "0.6.5"
objc2-foundation = "0.3.2"
objc2-virtualization = "0.3.2"
block2 = "0.6.2"
dispatch2 = "0.3.1"
libc = "0.2.191"

# Ferrodock's own engine on Windows: the certificates Windows trusts go
# to the engine too.
[target.'cfg(all(target_os = "windows", target_arch = "x86_64"))'.dependencies]
rustls-native-certs = "0.8.5"

[build-dependencies]
winresource = "0.1.34"

# Small, fast release binaries.
[profile.release]
lto = true
codegen-units = 1
strip = true

# Shown in the Windows file properties (embedded by build.rs).
[package.metadata.winresource]
ProductName = "Ferrodock"
FileDescription = "Ferrodock"
LegalCopyright = "Copyright (c) 2026 Mani Movassagh. MIT License."

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot", "eframe"] }
