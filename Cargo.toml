[package]
name = "ferrodock"
version = "0.4.0"
edition = "2024"
rust-version = "1.95"
authors = ["Mani Movassagh"]
repository = "https://github.com/manimovassagh/Ferrodock"
license = "MIT"
description = "A fast, native container manager for Docker, written in Rust."

[dependencies]
bollard = { version = "0.21.1", features = ["time"] }
eframe = "0.37.0"
egui_extras = { version = "0.37", default-features = false }
futures-util = "0.3.34"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "time"] }

[build-dependencies]
winresource = "0.1.34"

# Small, fast release binaries.
[profile.release]
lto = true
codegen-units = 1
strip = true

# Shown in the Windows file properties (embedded by build.rs).
[package.metadata.winresource]
ProductName = "Ferrodock"
FileDescription = "Ferrodock"
LegalCopyright = "Copyright (c) 2026 Mani Movassagh. MIT License."
