[package]
name = "ironstack"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "A fast, native container manager for Docker, written in Rust."

[dependencies]
bollard = { version = "0.21.1", features = ["time"] }
eframe = "0.37.0"
egui_extras = { version = "0.37", default-features = false }
futures-util = "0.3.34"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros"] }
