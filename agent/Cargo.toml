[package]
name = "ferrodock-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
authors = ["Mani Movassagh"]
repository = "https://github.com/manimovassagh/Ferrodock"
license = "MIT"
description = "Runs inside Ferrodock's Linux VM: boots it, keeps the Docker engine running and carries its socket to the host."
publish = false

[dependencies]
libc = "0.2.191"

# Standalone: not part of the app's workspace or its releases.
[workspace]

# Small, static binary for the VM.
[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
