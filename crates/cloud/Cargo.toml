[package]
name = "ferrodock-cloud"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
homepage.workspace = true
description = "ferrocloud: Ferrodock's local cloud emulator. Speaks the AWS APIs, so the AWS CLI, SDKs and Terraform work against it unchanged."
readme = "README.md"
keywords = ["aws", "emulator", "cloud", "testing"]
categories = ["development-tools"]
# Shipped as a container image with Ferrodock, not as a crate, for now.
publish = false

[[bin]]
name = "ferrocloud"
path = "src/main.rs"

[dependencies]
bytes.workspace = true
http-body-util = "0.1.5"
hyper = { version = "1.12", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
# SQLite compiled in: the image is one static program.
rusqlite = { version = "0.37", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["signal"] }
