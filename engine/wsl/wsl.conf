# Ferrodock's engine distro: only there to run the Docker engine, started
# by Ferrodock with `wsl.exe --exec /sbin/ferrodock-agent --stdio`.
[boot]
systemd=false

[automount]
# Windows drives under /mnt, for bind mounts such as /mnt/c/Users/me/app.
enabled=true
mountFsTab=false

[network]
hostname=ferrodock
generateHosts=true
generateResolvConf=true

[interop]
# Nothing in here starts Windows programs.
enabled=false
appendWindowsPath=false

[user]
default=root
